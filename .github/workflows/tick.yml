# Réveille LifePilot toutes les 10 minutes pour qu'il envoie la notification à l'heure choisie.
# Secrets requis (Settings → Secrets and variables → Actions) : LIFEPILOT_API_URL, LIFEPILOT_CRON_SECRET.
name: Réveil LifePilot
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *" # décalé de l'heure pile, moins chargée chez GitHub
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Réveiller l'application
        env:
          APP_API_URL: ${{ secrets.LIFEPILOT_API_URL }}
          CRON_SECRET: ${{ secrets.LIFEPILOT_CRON_SECRET }}
        run: |
          if [ -z "$APP_API_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets manquants"; exit 1; fi
          for i in 1 2 3; do
            code=$(curl -s -o resp.json -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" --max-time 60 "$APP_API_URL/api/cron/tick" || echo 000)
            if [ "$code" = "200" ]; then cat resp.json; exit 0; fi
            echo "Essai $i : HTTP $code"; sleep 20
          done
          exit 1
